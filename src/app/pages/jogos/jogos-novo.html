<section class="novo">
  <h1>Adicionar Jogo</h1>

  <div class="novo-card">
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="grid">

        <label>
          Título *
          <input type="text" formControlName="title" placeholder="Ex: Elden Ring" />
        </label>

        <label>
          Ano *
          <input type="number" inputmode="numeric" formControlName="year" placeholder="2024" />
        </label>

        <label>
          Desenvolvedora *
          <input type="text" formControlName="dev" placeholder="Ex: FromSoftware" />
        </label>

        <label>
          Publicadora *
          <input type="text" formControlName="pub" placeholder="Ex: Bandai Namco" />
        </label>

        <label>
          Gêneros *
          <input type="text" formControlName="genre" placeholder="RPG, Mundo Aberto" />
          <span class="hint">Separe por vírgula</span>
        </label>

        <label>
          Link na Steam *
          <input type="url" formControlName="steam" placeholder="https://store.steampowered.com/..." />
        </label>

        <label class="full">
          URL da Imagem *
          <input type="url" formControlName="img" placeholder="https://..." />
          <span class="hint">Imagem de capa usada no card</span>
        </label>

        <label class="full">
          Descrição *
          <textarea rows="4" formControlName="description"
                    placeholder="Descreva o jogo em pelo menos 10 caracteres…"></textarea>
        </label>
      </div>

      <button type="submit" class="btn-gradiente"
              [disabled]="form.invalid || submitting">
        {{ submitting ? 'Salvando…' : 'Salvar Jogo' }}
      </button>
    </form>
  </div>
</section>
