<header class="gn-header" role="banner">
  <div class="gn-wrap">
    <a class="brand" routerLink="/" (click)="closeMenu()">
      <img src="/logo.png" alt="Logo GamerzNew" class="logo" />
      <span class="brand-text">GamerzNew</span>
    </a>

    <!-- Botão Hambúrguer -->
    <button
      class="hamburger"
      type="button"
      aria-label="Abrir menu"
      aria-controls="primary-nav"
      [attr.aria-expanded]="menuOpen ? 'true' : 'false'"
      [class.active]="menuOpen"
      (click)="toggleMenu()">
      <span class="hamburger-bar" aria-hidden="true"></span>
      <span class="hamburger-bar" aria-hidden="true"></span>
      <span class="hamburger-bar" aria-hidden="true"></span>
    </button>

    <nav
      id="primary-nav"
      class="nav"
      [class.open]="menuOpen"
      aria-label="Navegação principal">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">Home</a>
      <a routerLink="/jogos" routerLinkActive="active" (click)="closeMenu()">Jogos</a>
      <a routerLink="/sobre" routerLinkActive="active" (click)="closeMenu()">Sobre</a>

      <span class="spacer" aria-hidden="true"></span>

      <ng-container *ngIf="user$ | async as user; else guestLinks">
        <span class="user-pill" aria-label="Usuária logada">
          {{ user.name || user.email }}
        </span>
        <button class="btn-logout" type="button" (click)="logout(); closeMenu()">Sair</button>
      </ng-container>

      <ng-template #guestLinks>
        <a routerLink="/login" routerLinkActive="active" (click)="closeMenu()">Login</a>
      </ng-template>
    </nav>
  </div>
</header>
