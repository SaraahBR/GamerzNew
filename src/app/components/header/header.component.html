<header class="gn-header" role="banner">
  <div class="gn-wrap">
    <a class="brand" routerLink="/" (click)="closeMenu()">
      <img src="/logo.png" alt="Logo GamerzNew" class="logo" />
      <span class="brand-text">GamerzNew</span>
    </a>

    <!-- Nav: SOMENTE links de navegação (entra no hambúrguer) -->
    <nav id="primary-nav" class="nav" [class.open]="menuOpen" aria-label="Navegação principal">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">Home</a>
      <a routerLink="/jogos" routerLinkActive="active" (click)="closeMenu()">Jogos</a>
      <a routerLink="/sobre" routerLinkActive="active" (click)="closeMenu()">Sobre</a>
    </nav>

    <!-- Controles SEMPRE na barra — fora do hambúrguer -->
    <div class="bar-controls">
      <button class="anim-toggle" type="button"
        [class.anim-off]="!animSvc.enabled()"
        [attr.aria-pressed]="animSvc.enabled()"
        [title]="animSvc.enabled() ? 'Desabilitar animações' : 'Habilitar animações'"
        aria-label="Alternar animações de fundo"
        (click)="animSvc.toggle()">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"
             width="20" height="20" aria-hidden="true">
          <circle cx="12" cy="4" r="2"/>
          <path d="M20.5 6c-2.61.7-5.67 1-8.5 1s-5.89-.3-8.5-1L3 8c1.86.5 4 .83 6 1v13h2v-6h2v6h2V9c2-.17 4.14-.5 6-1l-.5-2z"/>
        </svg>
      </button>

      <!-- Ícone de perfil genérico (Deslogado) -->
      <ng-container *ngIf="!(user$ | async)">
        <svg width="0" height="0" style="position:absolute">
          <defs>
            <linearGradient id="gn-avatar-grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ff77c8" />
              <stop offset="100%" stop-color="#d946ef" />
            </linearGradient>
          </defs>
        </svg>
        <a class="user-avatar" routerLink="/login" aria-label="Ir para a página de Login" title="Fazer Login">
          <span class="avatar-initial" style="-webkit-text-fill-color: initial; display: flex;">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="url(#gn-avatar-grad)">
              <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
          </span>
        </a>
      </ng-container>

      <!-- Ícone de perfil com foto/inicial (Logado) -->
      <ng-container *ngIf="user$ | async as user">
        <div class="profile-wrap" (click)="toggleProfile($event)">
          <span class="user-avatar" [class.open]="profileOpen"
                [attr.aria-label]="'Perfil de ' + (user.name || user.email)"
                [attr.aria-expanded]="profileOpen" role="button" tabindex="0"
                (keydown.enter)="toggleProfile($event)" (keydown.space)="toggleProfile($event)">
            <img *ngIf="user.picture" [src]="user.picture" [alt]="user.name || user.email"
                 class="avatar-img" referrerpolicy="no-referrer" />
            <span *ngIf="!user.picture" class="avatar-initial">
              {{ (user.name || user.email).charAt(0).toUpperCase() }}
            </span>
          </span>
          <div class="profile-dropdown" *ngIf="profileOpen"
               (click)="$event.stopPropagation()" role="menu">
            <div class="profile-name">{{ user.name || user.email }}</div>
            <hr class="profile-divider" />
            <button class="btn-logout" type="button" role="menuitem"
                    (click)="logout(); closeMenu()">Sair</button>
          </div>
        </div>
      </ng-container>
    </div>

    <!-- Hambúrguer -->
    <button class="hamburger" type="button" aria-label="Abrir menu"
      aria-controls="primary-nav"
      [attr.aria-expanded]="menuOpen ? 'true' : 'false'"
      [class.active]="menuOpen"
      (click)="toggleMenu()">
      <span class="hamburger-bar" aria-hidden="true"></span>
      <span class="hamburger-bar" aria-hidden="true"></span>
      <span class="hamburger-bar" aria-hidden="true"></span>
    </button>
  </div>
</header>
