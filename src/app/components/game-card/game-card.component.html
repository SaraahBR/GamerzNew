<article class="card">

  <!-- Imagem com overlay gradiente e badges de gênero -->
  <div class="img-wrap">
    <img [src]="game.img" [alt]="'Capa do jogo ' + game.title" loading="lazy" />
    <div class="genres" *ngIf="game.genre?.length">
      <span class="genre-badge">{{ game.genre[0] }}</span>
    </div>
  </div>

  <div class="content">
    <h2 appWordClamp="2">{{ game.title }}</h2>
    <p class="desc" appWordClamp="3">{{ game.description }}</p>

    <ul class="meta">
      <li><strong>Ano:</strong> {{ game.year }}</li>
      <li><strong>Dev:</strong> {{ game.dev }}</li>
      <li><strong>Pub:</strong> {{ game.pub }}</li>
    </ul>

    <!-- Badge de preço (ITAD) -->
    <app-deal-badge class="deal" [title]="game.title" [steam]="game.steam" [compact]="true"></app-deal-badge>
  </div>

  <div class="actions">
    <a class="btn-gradiente" [routerLink]="['/jogos', game.id]">Ver Detalhes</a>
    <a class="btn-sec steam-btn" [href]="game.steam" target="_blank" rel="noopener" aria-label="Ver na Steam">
      <svg class="steam-icon" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
        <path d="M11.979 0C5.678 0 .511 4.86.022 11.037l6.432 2.658c.545-.371 1.203-.59
          1.912-.59.063 0 .125.004.188.006l2.861-4.142V8.91c0-2.495 2.028-4.524
          4.524-4.524 2.494 0 4.524 2.029 4.524 4.524s-2.03 4.525-4.524
          4.525h-.105l-4.076 2.91c0 .052.004.105.004.159 0 1.875-1.515
          3.396-3.39 3.396-1.635 0-3.016-1.173-3.331-2.727L.436
          15.27C1.862 20.307 6.486 24 11.979 24c6.627 0 11.999-5.373
          11.999-12S18.605 0 11.979 0zM7.54 18.21l-1.473-.61c.262.543.714.999
          1.314 1.25 1.297.539 2.793-.076 3.332-1.375.263-.63.264-1.319.005-1.949s-.75-1.121-1.377-1.383c-.624-.26-1.29-.249-1.878-.03l1.523.63c.956.4
          1.409 1.5 1.009 2.455-.397.957-1.497 1.41-2.454
          1.012H7.54zm11.415-9.303c0-1.662-1.353-3.015-3.015-3.015-1.665
          0-3.015 1.353-3.015 3.015 0 1.665 1.35 3.015 3.015 3.015 1.663 0
          3.015-1.35 3.015-3.015zm-5.273-.005c0-1.252 1.013-2.266
          2.265-2.266 1.249 0 2.266 1.014 2.266 2.266 0
          1.251-1.017 2.265-2.266 2.265-1.252 0-2.265-1.014-2.265-2.265z"/>
      </svg>
      Steam
    </a>

    <!-- Favoritar -->
    <button
      type="button"
      class="fav-btn"
      (click)="toggleFavorite()"
      [attr.aria-pressed]="favorite"
      [attr.aria-label]="favorite ? 'Remover dos favoritos' : 'Adicionar aos favoritos'">
      <svg class="fav-icon" viewBox="0 0 24 24" aria-hidden="true" [class.is-active]="favorite">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"/>
      </svg>
    </button>

    <!-- Backlog -->
    <button
      type="button"
      class="btn-backlog"
      [class.added]="isInBacklog"
      (click)="toggleBacklog()">
      <span class="ico" aria-hidden="true"></span>
      {{ isInBacklog ? '✓ Backlog' : 'Backlog' }}
    </button>
  </div>

</article>
